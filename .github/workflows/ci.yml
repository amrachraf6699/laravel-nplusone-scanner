name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, tokenizer, xml
          coverage: none
      # This is a Composer library supporting Laravel 12 and 13. A committed
      # lock file would force one Laravel major across all PHP lanes, so each
      # lane resolves the compatible dependency set independently.
      - run: composer update --no-interaction --prefer-dist --no-progress
      - run: composer test
      - run: composer lint
      - run: composer validate --strict
